name: Fedora checks
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - name: Install build and test dependencies
        run: dnf install -y rpm-build python3-devel pyproject-rpm-macros python3-setuptools python3-wheel python3-pytest python3-gobject gtk4 libadwaita desktop-file-utils appstream xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon git
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Git checkout
        run: git rev-parse --is-inside-work-tree
      - name: Tests and static checks
        run: |
          PYTHONPATH=src python3 -m pytest -q
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python3 -m compileall -q src scripts tests
          git diff --check
          python3 scripts/check_docs.py
          desktop-file-validate data/io.github.tidylinux.TidyLinux.desktop
          appstreamcli validate --no-net data/io.github.tidylinux.TidyLinux.metainfo.xml
      - name: Native GUI smoke
        run: dbus-run-session -- xvfb-run -a python3 scripts/smoke_gui.py
        env:
          GSK_RENDERER: cairo
      - name: Build and verify RPM
        run: bash scripts/build_rpm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tidylinux-fedora45
          path: |
            dist/rpmbuild.*/RPMS/**/*.rpm
            dist/rpmbuild.*/RPMS/**/*.sha256
            dist/rpmbuild.*/SRPMS/*.rpm
            dist/rpmbuild.*/SRPMS/*.sha256
          if-no-files-found: error
